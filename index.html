<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Noto Sans Devanagari",sans-serif;
  color:#fff;
  background:#070707;
}


/* =========================================================
   BACKGROUND
========================================================= */

.page{
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:linear-gradient(rgba(0,0,0,.60),rgba(0,0,0,.92)),url("banner-desktop.webp");
  background-size:cover;
  background-position:center;
}

/* Dark overlay */
.page::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 25%,rgba(255,122,0,.13),transparent 38%);
  pointer-events:none;
  z-index:-1;
}


/* =========================================================
   HEADER
========================================================= */

header{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:18px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:10;
  flex:none;
}


.logo{

  font-size:17px;

  font-weight:800;

  letter-spacing:.3px;
}

.logo span{

  color:#ff7a00;
}


.clock{

  color:rgba(255,255,255,.65);

  font-size:13px;

  font-weight:500;

  padding:
    7px
    12px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:999px;

  background:
    rgba(255,255,255,.04);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  position:relative;
  z-index:2;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px 80px;
}


.hero-content{

  max-width:720px;

  margin:auto;
}


/* Badge */

.badge{

  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:
    7px
    13px;

  margin-bottom:22px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:999px;

  background:
    rgba(255,255,255,.055);

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  color:
    rgba(255,255,255,.75);

  font-size:12px;

  font-weight:600;
}


.badge::before{

  content:"";

  width:6px;

  height:6px;

  border-radius:50%;

  background:#ff7a00;

  box-shadow:
    0 0 12px
    rgba(255,122,0,.8);
}


/* Heading */

h1{

  font-size:
    clamp(
      42px,
      8vw,
      82px
    );

  line-height:1.05;

  font-weight:900;

  letter-spacing:-2px;

  text-shadow:
    0 10px 40px
    rgba(0,0,0,.65);
}


h1 span{

  color:#ff7a00;

  text-shadow:
    0 0 35px
    rgba(255,122,0,.18);
}


.subtitle{

  max-width:580px;

  margin:
    22px
    auto
    0;

  color:
    rgba(255,255,255,.68);

  font-size:
    clamp(
      14px,
      2vw,
      17px
    );

  line-height:1.9;

  font-weight:400;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-section{padding:0 0 40px;}

.player{
  width:min(520px,100%);
  margin:-38px auto 0;
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  background:rgba(10,10,10,.82);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 24px 80px rgba(0,0,0,.60);
  overflow:hidden;
  transition:border-color .3s,box-shadow .3s;
}

.player.playing{
  border-color:rgba(255,122,0,.28);
  box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 60px rgba(255,122,0,.07);
}

/* thin top line */
.player-accent{
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,122,0,.6),transparent);
  transition:opacity .3s;
}
.player.playing .player-accent{
  background:linear-gradient(90deg,transparent,#ff7a00,transparent);
  animation:accentPulse 2.5s ease-in-out infinite;
}
@keyframes accentPulse{0%,100%{opacity:.6;}50%{opacity:1;}}

.player-body{padding:18px 20px 20px;}

/* top row: song info 75% + controls 25%, always fixed */
.player-row{
  display:flex;
  align-items:center;
  gap:0;
}
.song-info{
  width:75%;
  flex:none;
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  overflow:hidden;
}
.controls{
  width:25%;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
}

/* =========================================================
   SONG INFO ROW
========================================================= */

/* remove blue focus outline on all buttons */
.control:focus{outline:none;}
.control:focus-visible{outline:2px solid rgba(255,122,0,.5);outline-offset:2px;}

/* song-info width set in .player-row above */

/* cover — rounded square with music note SVG */
.cover{
  width:52px;
  height:52px;
  flex:none;
  border-radius:12px;
  background:linear-gradient(135deg,#1a0a00,#2d1200);
  border:1px solid rgba(255,122,0,.18);
  box-shadow:0 4px 16px rgba(0,0,0,.50);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  transition:box-shadow .3s,border-color .3s;
}
.cover::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,122,0,.18),transparent 65%);
}
.cover svg{
  width:24px;
  height:24px;
  fill:#ff7a00;
  opacity:.9;
  position:relative;
  z-index:1;
  transition:transform .3s;
}
.player.playing .cover{
  border-color:rgba(255,122,0,.40);
  box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 18px rgba(255,90,0,.18);
}
.player.playing .cover svg{
  animation:noteBounce 1.8s ease-in-out infinite;
}
@keyframes noteBounce{
  0%,100%{transform:scale(1) rotate(-4deg);}
  50%{transform:scale(1.12) rotate(4deg);}
}

.song-details{min-width:0;flex:1;}

.song-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:3px;
}

.song-num{
  font-size:9px;
  font-weight:700;
  color:rgba(255,122,0,.75);
  letter-spacing:.6px;
  white-space:nowrap;
  flex:none;
}

.song-title{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:-.2px;
  flex:1;
  min-width:0;
}

.song-artist{
  font-size:11px;
  color:rgba(255,255,255,.38);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* waveform */
.waveform{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:16px;
  margin-top:6px;
}
.waveform span{
  width:2px;
  border-radius:2px;
  background:rgba(255,122,0,.22);
}
.waveform span:nth-child(1){height:5px;}
.waveform span:nth-child(2){height:9px;}
.waveform span:nth-child(3){height:14px;}
.waveform span:nth-child(4){height:7px;}
.waveform span:nth-child(5){height:12px;}
.waveform span:nth-child(6){height:6px;}
.waveform span:nth-child(7){height:10px;}

.player.playing .waveform span{background:#ff7a00;}
.player.playing .waveform span:nth-child(1){animation:wave 1.1s ease-in-out infinite;}
.player.playing .waveform span:nth-child(2){animation:wave 1.3s ease-in-out infinite .12s;}
.player.playing .waveform span:nth-child(3){animation:wave .9s ease-in-out infinite .05s;}
.player.playing .waveform span:nth-child(4){animation:wave 1.2s ease-in-out infinite .22s;}
.player.playing .waveform span:nth-child(5){animation:wave 1.0s ease-in-out infinite .08s;}
.player.playing .waveform span:nth-child(6){animation:wave 1.4s ease-in-out infinite .28s;}
.player.playing .waveform span:nth-child(7){animation:wave 1.1s ease-in-out infinite .18s;}
@keyframes wave{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}

/* =========================================================
   PROGRESS
========================================================= */

.progress{margin-top:16px;}

.track{
  width:100%;
  height:3px;
  border-radius:99px;
  background:rgba(255,255,255,.07);
  cursor:pointer;
  overflow:hidden;
  transition:height .15s;
}
.track:hover{height:5px;}

.fill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#e04000,#ff7a00);
  box-shadow:0 0 8px rgba(255,122,0,.4);
  transition:width .2s linear;
}

.time{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  font-size:9px;
  color:rgba(255,255,255,.25);
  letter-spacing:.4px;
}

/* =========================================================
   CONTROLS — right side on desktop, below on mobile
========================================================= */

/* controls width set in .player-row above */

.control{
  width:36px;
  height:36px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.60);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  outline:none;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.control:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.16);
  color:#fff;
  transform:translateY(-1px);
}
.control:active{transform:scale(.92);}

.control.main{
  width:40px;
  height:40px;
  border:none;
  background:linear-gradient(145deg,#ff7a00,#e04000);
  color:#fff;
  font-size:16px;
  box-shadow:0 4px 18px rgba(255,80,0,.30);
  outline:none;
  transition:transform .18s,box-shadow .18s;
}
.control.main:hover{
  transform:scale(1.07);
  box-shadow:0 6px 24px rgba(255,80,0,.48);
}
.player.playing .control.main{
  animation:playPulse 2.2s ease-in-out infinite;
}
@keyframes playPulse{
  0%,100%{box-shadow:0 4px 18px rgba(255,80,0,.30);}
  50%{box-shadow:0 4px 26px rgba(255,80,0,.55),0 0 0 4px rgba(255,122,0,.09);}
}


/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

.youtube-player{

  position:absolute;

  width:1px;

  height:1px;

  left:-9999px;

  top:-9999px;

  opacity:0;

  pointer-events:none;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  text-align:center;
  padding:0 20px 18px;
  color:rgba(255,255,255,.30);
  font-size:11px;
  line-height:2;
  flex:none;
}

.made-by{
  margin-top:5px;

  color:
    rgba(255,255,255,.45);
}

.heart{
  color:#ff4d6d;

  display:inline-block;

  margin:
    0
    3px;

  animation:
    heartBeat
    1.4s
    ease-in-out
    infinite;
}

.made-by a{
  color:#fff;

  text-decoration:none;

  font-weight:700;

  transition:
    color .2s ease;
}

.made-by a:hover{
  color:#ff7a00;
}

@keyframes heartBeat{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.18);
  }

}


/* =========================================================
   ANIMATION
========================================================= */


/* =========================================================
   TABLET
========================================================= */

@media(max-width:768px){
  header{width:calc(100% - 28px);padding-top:14px;}
  main{width:calc(100% - 28px);}
  .hero{padding:30px 12px 70px;}
  .player{margin-top:-30px;border-radius:18px;}
  .player-body{padding:16px 18px 18px;}
}

/* MOBILE — controls stack below song info */
@media(max-width:480px){
  .page{
    background-image:
      linear-gradient(180deg,rgba(8,4,0,.30) 0%,rgba(12,6,0,.55) 40%,rgba(6,3,0,.82) 100%),
      url("banner-mobile.webp");
  }
  header{width:calc(100% - 24px);padding-top:12px;}
  .logo{font-size:15px;}
  .clock{font-size:11px;padding:5px 10px;}
  main{width:calc(100% - 24px);}
  .hero{padding:24px 8px 60px;}
  .badge{font-size:10px;padding:5px 10px;margin-bottom:14px;}
  h1{font-size:clamp(34px,12vw,52px);letter-spacing:-1.5px;}
  .subtitle{margin-top:12px;font-size:12px;line-height:1.75;}
  .music-section{padding-bottom:24px;}
  .player{margin-top:-26px;border-radius:16px;}
  .player-body{padding:14px 15px 15px;}
  /* stack: song info full width, controls centered below */
  .player-row{flex-direction:column;align-items:stretch;gap:12px;}
  .song-info{width:100%;}
  .controls{width:100%;justify-content:center;gap:10px;}
  .cover{width:42px;height:42px;border-radius:10px;}
  .cover svg{width:19px;height:19px;}
  .song-title{font-size:13px;}
  .song-artist{font-size:10px;}
  .control{width:34px;height:34px;font-size:12px;}
  .control.main{width:42px;height:42px;font-size:15px;}
  footer{padding-bottom:20px;font-size:10px;}
}

@media(max-width:340px){
  .player-body{padding:12px 13px 13px;}
  .cover{width:36px;height:36px;}
  .song-title{font-size:12px;}
}

</style>

</head>

/* =========================================================
   PLAYER VARIABLES
========================================================= */

let player = null;

let ready = false;

let currentIndex = 0;

let timer = null;


/* =========================================================
   YOUTUBE API
========================================================= */

function loadYouTubeAPI(){

  if(
    window.YT &&
    window.YT.Player
  ){

    createPlayer();

    return;
  }


  window.onYouTubeIframeAPIReady =
    function(){

      createPlayer();

    };


  if(
    !document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )
  ){

    const script =
      document.createElement("script");


    script.src =
      "https://www.youtube.com/iframe_api";


    script.async = true;


    document.head.appendChild(script);

  }

}


/* =========================================================
   CREATE PLAYER
========================================================= */

function createPlayer(){

  if(player){
    return;
  }


  player =
    new YT.Player(
      "yt",
      {

        width:"1",

        height:"1",

        videoId:
          SONGS[currentIndex].id,


        playerVars:{

          autoplay:0,

          controls:0,

          disablekb:1,

          playsinline:1,

          rel:0,

          modestbranding:1,

          iv_load_policy:3,

          enablejsapi:1,

          fs:0,

          cc_load_policy:0,

          origin:
            window.location.origin

        },


        events:{

          onReady:function(){

            ready = true;

            updateSong();

          },


          onStateChange:function(event){

            const state =
              event.data;


            if(
              state ===
              YT.PlayerState.PLAYING
            ){

              document
                .body
                .classList
                .add("playing");


              document
                .getElementById("panel")
                .classList
                .add("playing");


              document
                .getElementById("play")
                .textContent =
                "⏸";


              startTimer();

            }


            else if(
              state ===
              YT.PlayerState.PAUSED
            ){

              stopPlaying();

            }


            else if(
              state ===
              YT.PlayerState.ENDED
            ){

              stopTimer();

              goTo(
                currentIndex + 1,
                true
              );

            }

          },


          onError:function(event){

            const errors = {

              2:
                "गीत उपलब्ध नहीं है।",

              5:
                "यूट्यूब प्लेयर में समस्या हुई।",

              100:
                "यह गीत उपलब्ध या सार्वजनिक नहीं है।",

              101:
                "यह गीत इस वेबसाइट पर चलाने की अनुमति नहीं देता।",

              150:
                "यह गीत इस वेबसाइट पर चलाने की अनुमति नहीं देता।",

              153:
                "यूट्यूब इस प्लेयर अनुरोध की पहचान नहीं कर सका।"

            };


            document
              .getElementById("song")
              .textContent =
              errors[event.data] ||
              "गीत चलाने में समस्या हुई।";


            document
              .getElementById("artist")
              .textContent =
              "यूट्यूब त्रुटि " +
              event.data;


            stopPlaying();


            console.error(
              "YouTube Error:",
              event.data
            );

          }

        }

      }
    );

}


/* =========================================================
   STOP PLAYING
========================================================= */

function stopPlaying(){

  document
    .body
    .classList
    .remove("playing");


  document
    .getElementById("panel")
    .classList
    .remove("playing");


  document
    .getElementById("play")
    .textContent =
    "▶";


  stopTimer();

}


/* =========================================================
   SONG INFORMATION
========================================================= */

function updateSong(){

  const song =
    SONGS[currentIndex];


  document
    .getElementById("song")
    .textContent =
    song.title;


  document
    .getElementById("artist")
    .textContent =
    song.artist;


  document
    .getElementById("songnum")
    .textContent =
    String(currentIndex + 1).padStart(2,"0") +
    "/" +
    String(SONGS.length).padStart(2,"0");


  document
    .getElementById("cur")
    .textContent =
    "0:00";


  document
    .getElementById("dur")
    .textContent =
    "0:00";


  document
    .getElementById("fill")
    .style
    .width =
    "0%";

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

document
  .getElementById("play")
  .addEventListener(
    "click",
    function(){

      if(
        !ready ||
        !player
      ){

        document
          .getElementById("song")
          .textContent =
          "यूट्यूब लोड हो रहा है…";

        return;
      }


      const state =
        player.getPlayerState();


      if(
        state ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

        return;

      }


      player.loadVideoById({

        videoId:
          SONGS[currentIndex].id,

        startSeconds:0

      });


      player.playVideo();

    }
  );


/* =========================================================
   NEXT
========================================================= */

document
  .getElementById("next")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex + 1,
        true
      );

    }
  );


/* =========================================================
   PREVIOUS
========================================================= */

document
  .getElementById("prev")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex - 1,
        true
      );

    }
  );


/* =========================================================
   CHANGE SONG
========================================================= */

function goTo(
  index,
  autoplay
){

  currentIndex =
    (
      (
        index %
        SONGS.length
      ) +
      SONGS.length
    ) %
    SONGS.length;


  updateSong();


  if(
    !ready ||
    !player
  ){

    return;

  }


  stopTimer();


  player.loadVideoById({

    videoId:
      SONGS[currentIndex].id,

    startSeconds:0

  });


  if(autoplay){

    player.playVideo();

  }

}


/* =========================================================
   PROGRESS CLICK
========================================================= */

document
  .getElementById("track")
  .addEventListener(
    "click",
    function(event){

      if(
        !ready ||
        !player
      ){

        return;

      }


      const duration =
        player.getDuration();


      if(
        !duration ||
        duration <= 0
      ){

        return;

      }


      const rect =
        event.currentTarget
          .getBoundingClientRect();


      const fraction =
        Math.min(
          1,
          Math.max(
            0,
            (
              event.clientX -
              rect.left
            ) /
            rect.width
          )
        );


      player.seekTo(
        fraction * duration,
        true
      );

    }
  );


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  stopTimer();


  timer =
    setInterval(
      function(){

        if(
          !player ||
          !ready
        ){

          return;

        }


        const current =
          player.getCurrentTime();


        const duration =
          player.getDuration();


        document
          .getElementById("cur")
          .textContent =
          formatTime(current);


        document
          .getElementById("dur")
          .textContent =
          formatTime(duration);


        if(duration > 0){

          document
            .getElementById("fill")
            .style
            .width =
            (
              current /
              duration *
              100
            ) +
            "%";

        }

      },
      250
    );

}


function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

  seconds =
    Math.floor(
      seconds || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    remaining
  );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const clock =
    document.getElementById(
      "clock"
    );


  clock.textContent =
    new Date()
      .toLocaleTimeString(
        "hi-IN",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =========================================================
   START
========================================================= */

loadYouTubeAPI();

</script>
